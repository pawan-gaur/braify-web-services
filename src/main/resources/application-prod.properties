#  Production profile activated by: -Dspring.profiles.active=prod
#  All sensitive values are injected via environment variables from
#  /opt/braify-web-services/.env (loaded by systemd EnvironmentFile=)

spring.application.name=braify-web-services

# Server Port
server.port=8080

# MongoDB
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=${MONGO_DATABASE:braify}

# JWT Secret
jwt.secret=${JWT_SECRET}
jwt.expiration-hours=24

# Resend Configuration
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL}

# APP Url
app.frontend-url=${APP_FRONTEND_URL:https://yourdomain.com}

# CORS: comma-separated allowed origins for external API consumers
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://yourdomain.com}

# Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MVC
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Email sent via Resend (see resend.* below); SMTP/JavaMailSender is disabled
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Logging (quieter in prod)
logging.level.com.braify=INFO
logging.level.io.github.openhtmltopdf=WARN
logging.level.org.springframework.security=WARN

# Production profile activated by: -Dspring.profiles.active=prod
# All sensitive values are injected via environment variables from
# /opt/braify-web-services/.env (loaded by systemd EnvironmentFile=)

server:
  port: 8080

spring:
  application:
    name: braify-web-services

  # MongoDB
  data:
    mongodb:
      uri: "${MONGO_URI}"
      database: "${MONGO_DATABASE:braify}"
      # Build @Document/@CompoundIndex-declared indexes on startup (background). Required so
      # bulk-email tracking lookups (rows.trackingId, bulk_email_events, and the unique
      # email_suppressions (orgId,email) index) are served from indexes rather than collection scans.
      auto-index-creation: true

  # Upload limits
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # MVC
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  # Email sent via Resend (see resend.* below); SMTP/JavaMailSender is disabled
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# JWT Secret
jwt:
  secret: "${JWT_SECRET}"
  expiration-hours: 9

app:
  # AES-256-GCM encryption key for sensitive at-rest fields (cloud credentials)
  # Set ENCRYPTION_SECRET in the systemd .env file — never hard-code in production.
  encryption:
    secret: "${ENCRYPTION_SECRET}"
  frontend-url: "${APP_FRONTEND_URL:https://braify.com}"
  base-url: "${APP_BASE_URL:https://braify.com}"
  # Refresh cookie is only sent over HTTPS in production.
  cookie-secure: true
  # CORS: comma-separated allowed origins for external API consumers
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:https://braify.com}"
  # Bulk-email tracking. base-url must be the PUBLIC origin that email clients can reach
  # and that reverse-proxies /api/* to this backend (i.e. the site origin). The signing
  # secret defaults to JWT_SECRET; set TRACKING_SECRET in the systemd .env to rotate it
  # independently. Disable a channel by setting its *_ENABLED var to false.
  tracking:
    base-url: "${APP_TRACKING_BASE_URL:${APP_BASE_URL:https://braify.com}}"
    secret: "${TRACKING_SECRET:${JWT_SECRET}}"
    open-enabled: ${TRACKING_OPEN_ENABLED:true}
    click-enabled: ${TRACKING_CLICK_ENABLED:true}
    unsubscribe-enabled: ${TRACKING_UNSUBSCRIBE_ENABLED:false}

# Do NOT expose the API docs / Swagger UI in production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Resend Configuration
resend:
  api-key: "${RESEND_API_KEY}"
  from-email: "${RESEND_FROM_EMAIL}"

# Bulk-email sending reliability (see application.yml for docs)
bulkemail:
  rate-limit-per-second: ${BULK_EMAIL_RATE_PER_SEC:8}
  max-send-attempts: ${BULK_EMAIL_MAX_ATTEMPTS:3}

# Logging (quieter in prod)
logging:
  level:
    com.braify: INFO
    io.github.openhtmltopdf: WARN
    org.springframework.security: WARN

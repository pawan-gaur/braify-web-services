server:
  port: ${SERVER_PORT:8080}
  # Gzip API/JSON (and any static) responses ≥1KB. JSON compresses ~80–90%, which
  # sharply cuts transfer time for users on high-latency / low-bandwidth links
  # (e.g. Kenya, Rwanda). Applied by the embedded server regardless of hosting.
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/xml,text/html,text/css,text/plain,application/javascript,image/svg+xml
    min-response-size: 1024

spring:
  application:
    name: braify-web-services
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:./env.local[.properties]

  # MongoDB
  # uri example: mongodb://user:pass@localhost:27017/{DB_NAME}?authSource=admin
  data:
    mongodb:
      uri: "${MONGO_URI}"
      database: "${MONGO_DATABASE}"
      auto-index-creation: true

  # Max upload size (for image uploads in templates)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB   # file cap stays 10MB; headroom for the multipart envelope

  # Route error handling lets GlobalExceptionHandler catch 404s from Spring MVC
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  # Email sent via Resend (see resend.* below); SMTP/JavaMailSender is disabled
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
  # NOTE: DevTools (restart/livereload) is configured in application-dev.yml only, so it is
  # never enabled outside the dev profile. (The dependency is <optional> and absent from the prod jar.)

# JWT
jwt:
  # MUST be provided via the JWT_SECRET env var (>=32 chars, random). No usable default —
  # JwtUtil fails fast on startup if it is missing/short so the app never signs with a weak key.
  secret: "${JWT_SECRET}"
  expiration-hours: 9

app:
  # AES-256-GCM encryption for sensitive at-rest fields (cloud credentials, etc.)
  # IMPORTANT: change this to a strong, random secret in production and keep it in a vault.
  # The key is hashed with SHA-256 internally so any length works, but use 32+ characters.
  encryption:
    secret: "${ENCRYPTION_SECRET}"
  frontend-url: http://localhost:5173
  base-url: http://localhost:5173
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"
  # Bulk-email open/click/unsubscribe tracking. base-url MUST be an origin that email
  # clients can reach and that routes /api/* to this backend (in prod that is the public
  # site origin, which reverse-proxies /api to :8080). Defaults to app.base-url. The
  # secret signs click/unsubscribe links (open-redirect protection) — defaults to the JWT
  # secret so no extra env var is required; override with TRACKING_SECRET if desired.
  tracking:
    base-url: "${APP_TRACKING_BASE_URL:${APP_BASE_URL:http://localhost:5173}}"
    secret: "${TRACKING_SECRET:${JWT_SECRET:}}"
    open-enabled: ${TRACKING_OPEN_ENABLED:true}
    click-enabled: ${TRACKING_CLICK_ENABLED:true}
    unsubscribe-enabled: ${TRACKING_UNSUBSCRIBE_ENABLED:false}
  # Email one-time sign-in codes (POST /api/auth/otp/*) — used by Braify users and
  # e-sign recipients (signer inbox). Codes are single-use and stored hashed.
  otp:
    length: ${OTP_LENGTH:6}
    ttl-minutes: ${OTP_TTL_MINUTES:10}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    resend-seconds: ${OTP_RESEND_SECONDS:60}
    max-per-hour: ${OTP_MAX_PER_HOUR:5}
    max-failures-per-day: ${OTP_MAX_FAILURES_PER_DAY:10}
    lockout-hours: ${OTP_LOCKOUT_HOURS:24}
  # First Platform Admin, created only on an empty database (nothing happens if it exists).
  seed:
    admin-email: ${SEED_ADMIN_EMAIL:admin@braify.com}
    admin-password: ${SEED_ADMIN_PASSWORD:}
  # Self-serve billing (Stripe). Checkout/portal appear only when STRIPE_SECRET_KEY and the Pro price
  # are set; otherwise plans stay manual (Platform Admin) exactly as before. Trials apply to new
  # self-serve sign-ups only. Webhook endpoint: POST /api/billing/webhook (events:
  # checkout.session.completed, customer.subscription.created/updated/deleted).
  billing:
    enabled: ${BILLING_ENABLED:true}
    trial-days: ${BILLING_TRIAL_DAYS:14}
    pro-monthly-price-id: ${STRIPE_PRICE_PRO_MONTHLY:}
    pro-yearly-price-id: ${STRIPE_PRICE_PRO_YEARLY:}
    pro-monthly-display: "${BILLING_PRO_MONTHLY_DISPLAY:$29}"
    pro-yearly-display: "${BILLING_PRO_YEARLY_DISPLAY:$290}"
  # Instant self-serve sign-up (/get-started). Set SIGNUP_ENABLED=false to require the
  # approval-based onboarding request flow only.
  signup:
    enabled: ${SIGNUP_ENABLED:true}
  # Managed storage: the platform's own S3 bucket, used by orgs that have NOT configured their
  # own bucket (Settings → Cloud Storage). Leave PLATFORM_STORAGE_BUCKET empty to disable — orgs
  # then must bring their own bucket, as before. Keys are optional: blank uses the AWS default
  # credential chain (e.g. the EC2 instance role). Objects go under <path>/<orgId>/...
  platform-storage:
    bucket: ${PLATFORM_STORAGE_BUCKET:}
    region: ${PLATFORM_STORAGE_REGION:us-east-1}
    access-key: ${PLATFORM_STORAGE_ACCESS_KEY:}
    secret-key: ${PLATFORM_STORAGE_SECRET_KEY:}
    path: ${PLATFORM_STORAGE_PATH:tenants}
    max-upload-mb: ${PLATFORM_STORAGE_MAX_UPLOAD_MB:10}
    url-expiry-minutes: ${PLATFORM_STORAGE_URL_EXPIRY_MINUTES:15}
  # Platform-level system emails (sign-in code): product name, accent and optional footer contact.
  mail:
    product-name: ${MAIL_PRODUCT_NAME:Braify E-Sign}
    accent: "${MAIL_ACCENT:#4F46E5}"
    support-email: ${MAIL_SUPPORT_EMAIL:support@braify.com}
    postal-address: ${MAIL_POSTAL_ADDRESS:}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

resend:
  api-key: "${RESEND_KEY}"
  from-email: "${RESEND_FROM_EMAIL}"
  # Optional separate sender for sign-in codes — use a different subdomain than bulk/marketing mail
  # (e.g. "Braify <no-reply@notify.yourdomain.com>") so Gmail keeps them out of Promotions.
  transactional-from-email: "${RESEND_TRANSACTIONAL_FROM_EMAIL:}"

# AI assist for the PDF & email template builders. Pluggable provider; the feature is
# available only when enabled AND the active provider has an API key. Set keys via env.
braify:
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:openai}   # anthropic | openai | gemini | grok
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:8000}
    document-max-output-tokens: ${AI_DOCUMENT_MAX_OUTPUT_TOKENS:16000}   # "template from document" replies
    document-max-chars: ${AI_DOCUMENT_MAX_CHARS:120000}                  # longer uploads are rejected, not truncated
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-opus-5-5}
      base-url: https://api.anthropic.com/v1
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o}
      base-url: https://api.openai.com/v1
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-pro}
      base-url: https://generativelanguage.googleapis.com/v1beta
    grok:
      api-key: ${GROK_API_KEY:}
      model: ${GROK_MODEL:grok-2-latest}
      base-url: https://api.x.ai/v1

# Bulk-email sending reliability
bulkemail:
  # Combined sends/second across all workers & campaigns (keep under your Resend plan's limit).
  # Set to 0 to disable throttling.
  rate-limit-per-second: ${BULK_EMAIL_RATE_PER_SEC:8}
  # Attempts per recipient before giving up — only transient errors (429/5xx/timeouts) are retried.
  max-send-attempts: ${BULK_EMAIL_MAX_ATTEMPTS:3}
  # Parallel workers per campaign. Keep low on small instances (2–3 on a t3.micro); raise on bigger hosts.
  concurrency: ${BULK_EMAIL_CONCURRENCY:3}
  # Recipients fetched per page while sending (memory stays flat regardless of campaign size).
  batch-size: ${BULK_EMAIL_BATCH_SIZE:100}
  # Max recipients / Sheet-2 rows accepted per campaign (bounded by request size, not storage).
  max-rows: ${BULK_EMAIL_MAX_ROWS:25000}
  max-detail-rows: ${BULK_EMAIL_MAX_DETAIL_ROWS:100000}
  migration:
    # Migrate legacy campaigns (embedded rows) to the recipients collection at startup.
    # Leave on; when off, each legacy campaign is still migrated lazily on first access.
    enabled: ${BULK_EMAIL_MIGRATION_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Logging
logging:
  level:
    # com.braify is our application package
    com.braify: INFO
    # Show request-level logs from the logging filter
    com.braify.config.RequestLoggingFilter: INFO
    # Suppress verbose openhtmltopdf output
    io.github.openhtmltopdf: WARN
    # Suppress Spring Security debug noise; set to DEBUG locally when troubleshooting auth
    org.springframework.security: WARN

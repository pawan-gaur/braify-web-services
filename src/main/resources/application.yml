server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: braify-web-services
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:./env.local[.properties]

  # MongoDB
  # uri example: mongodb://user:pass@localhost:27017/{DB_NAME}?authSource=admin
  data:
    mongodb:
      uri: "${MONGO_URI}"
      database: "${MONGO_DATABASE}"
      auto-index-creation: true

  # Max upload size (for image uploads in templates)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Route error handling lets GlobalExceptionHandler catch 404s from Spring MVC
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  # Email sent via Resend (see resend.* below); SMTP/JavaMailSender is disabled
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
  # NOTE: DevTools (restart/livereload) is configured in application-dev.yml only, so it is
  # never enabled outside the dev profile. (The dependency is <optional> and absent from the prod jar.)

# JWT
jwt:
  # MUST be provided via the JWT_SECRET env var (>=32 chars, random). No usable default —
  # JwtUtil fails fast on startup if it is missing/short so the app never signs with a weak key.
  secret: "${JWT_SECRET}"
  expiration-hours: 9

app:
  # AES-256-GCM encryption for sensitive at-rest fields (cloud credentials, etc.)
  # IMPORTANT: change this to a strong, random secret in production and keep it in a vault.
  # The key is hashed with SHA-256 internally so any length works, but use 32+ characters.
  encryption:
    secret: "${ENCRYPTION_SECRET}"
  frontend-url: http://localhost:5173
  base-url: http://localhost:5173
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"

resend:
  api-key: "${RESEND_KEY}"
  from-email: "${RESEND_FROM_EMAIL}"

# AI assist for the PDF & email template builders. Pluggable provider; the feature is
# available only when enabled AND the active provider has an API key. Set keys via env.
braify:
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:anthropic}   # anthropic | openai | gemini | grok
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:8000}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-opus-4-8}
      base-url: https://api.anthropic.com/v1
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o}
      base-url: https://api.openai.com/v1
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-pro}
      base-url: https://generativelanguage.googleapis.com/v1beta
    grok:
      api-key: ${GROK_API_KEY:}
      model: ${GROK_MODEL:grok-2-latest}
      base-url: https://api.x.ai/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Logging
logging:
  level:
    # com.braify is our application package
    com.braify: INFO
    # Show request-level logs from the logging filter
    com.braify.config.RequestLoggingFilter: INFO
    # Suppress verbose openhtmltopdf output
    io.github.openhtmltopdf: WARN
    # Suppress Spring Security debug noise; set to DEBUG locally when troubleshooting auth
    org.springframework.security: WARN

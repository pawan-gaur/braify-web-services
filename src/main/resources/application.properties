spring.application.name=braify-web-services
server.port=8080

# MongoDB
#spring.data.mongodb.uri=mongodb://pawangaur001_db_user:root@localhost:27017/{DB_NAME}?authSource=admin
spring.data.mongodb.uri={MONGO_DB_URL}
spring.data.mongodb.database={DB_NAME}
spring.data.mongodb.auto-index-creation=true

# Max upload size (for image uploads in templates)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Route error handling lets GlobalExceptionHandler catch 404s from Spring MVC
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# JWT
jwt.secret={JWT_SECRET}
jwt.expiration-hours=24

# AES-256-GCM encryption for sensitive at-rest fields (cloud credentials, etc.)
# IMPORTANT: Change this to a strong, random secret in production and keep it in a vault.
# The key is hashed with SHA-256 internally so any length works, but use 32+ characters.
app.encryption.secret=${JWT_SECRET}

# App
app.frontend-url=http://localhost:5173
app.base-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Email sent via Resend (see resend.* below); SMTP/JavaMailSender is disabled
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

resend.api-key={RESEND_KEY}
resend.from-email={RESEND_FROM_EMAIL}

# Logging
# com.braify our application package (was incorrectly set to com.pdfgenerator before)
logging.level.com.braify=INFO
# Show request-level logs from the logging filter
logging.level.com.braify.config.RequestLoggingFilter=INFO
# Suppress verbose openhtmltopdf output
logging.level.io.github.openhtmltopdf=WARN
# Suppress Spring Security debug noise; set to DEBUG locally when troubleshooting auth
logging.level.org.springframework.security=WARN
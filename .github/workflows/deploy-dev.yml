name: CD — braify-web-services (dev)

# Deploys the `develop` branch to the DEV EC2 instance.
# Prod (deploy.yml) deploys `main`; this file deploys `develop`.
# Uses DEV_-prefixed secrets so it targets a separate box from production:
#   DEV_EC2_HOST · DEV_EC2_USERNAME · DEV_EC2_SSH_KEY
on:
  push:
    branches: [develop]
  workflow_dispatch:   # allow manual "Run workflow" from the Actions tab

concurrency:
  group: deploy-dev-services
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Java 17 ─────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ── 3. Build JAR ───────────────────────────────────────────────────
      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Rename JAR to app.jar
        run: mv target/braify-web-services-*.jar target/app.jar

      # ── 4. Upload JAR to DEV EC2 ───────────────────────────────────────
      - name: Upload JAR to dev EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key:      ${{ secrets.DEV_EC2_SSH_KEY }}
          source:   "target/app.jar"
          target:   "/opt/braify-web-services/"
          strip_components: 1

      # ── 5. Restart service ─────────────────────────────────────────────
      - name: Restart braify-web-services (dev)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key:      ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            sudo systemctl restart braify-web-services
            sleep 8
            STATUS=$(sudo systemctl is-active braify-web-services)
            echo "Service status: $STATUS"
            if [ "$STATUS" != "active" ]; then
              echo "❌ Service failed to start. Last 30 lines of journal:"
              sudo journalctl -u braify-web-services -n 30 --no-pager
              exit 1
            fi
            echo "✅ braify-web-services (dev) is running"
